events {
    worker_connections 1024;
}

stream {
    # FIX Protocol requires session affinity
    # Use IP hash to ensure same client goes to same gateway
    upstream fixlite_gateways {
        ip_hash;
        server fixlite-gw-1:9878 max_fails=3 fail_timeout=30s;
        server fixlite-gw-2:9878 max_fails=3 fail_timeout=30s;
        server fixlite-gw-3:9878 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 9878;
        proxy_pass fixlite_gateways;
        proxy_timeout 1s;
        proxy_responses 1;
        proxy_connect_timeout 1s;
    }

    # Health check endpoint
    server {
        listen 8080;
        proxy_pass fixlite_gateways;
    }
}

# HTTP for monitoring
http {
    upstream fixlite_metrics {
        server fixlite-gw-1:8081;
        server fixlite-gw-2:8081;
        server fixlite-gw-3:8081;
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://fixlite_metrics;
        }
    }
}
