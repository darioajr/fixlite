apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-kraft-config
data:
  server.properties: |
    # KRaft Configuration
    process.roles=broker,controller
    controller.quorum.voters=1@kafka-1.kafka-headless:19092,2@kafka-2.kafka-headless:19093,3@kafka-3.kafka-headless:19094
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    
    # Cluster ID for KRaft (must be consistent across all brokers)
    cluster.id=MkU3OEVBNTcwNTJENDM2Qk
    
    # RPO=0 Configuration
    default.replication.factor=3
    min.insync.replicas=2
    unclean.leader.election.enable=false
    log.flush.interval.messages=1
    log.flush.interval.ms=100
    
    # Performance settings
    offsets.topic.replication.factor=3
    transaction.state.log.min.isr=2
    transaction.state.log.replication.factor=3
    group.initial.rebalance.delay.ms=0
    
    # KRaft specific settings
    metadata.log.segment.ms=15000
    metadata.max.retention.ms=86400000
    
    # Log settings
    log.dirs=/var/lib/kafka/data
    num.network.threads=8
    num.io.threads=16
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    
    # Compression and batching
    compression.type=lz4
    batch.size=65536
    linger.ms=5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
  - name: plaintext
    port: 29092
    targetPort: 29092
  - name: controller
    port: 19092
    targetPort: 19092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-cluster
spec:
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:8.0.0
        ports:
        - containerPort: 9092
        - containerPort: 29092
        - containerPort: 19092
        env:
        - name: KAFKA_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka-0.kafka-headless:19092,2@kafka-1.kafka-headless:19092,3@kafka-2.kafka-headless:19092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).kafka-headless:29092,PLAINTEXT_HOST://$(POD_NAME).kafka-headless:9092"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: CLUSTER_ID
          value: "MkU3OEVBNTcwNTJENDM2Qk"
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"
        - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
          value: "false"
        - name: KAFKA_LOG_FLUSH_INTERVAL_MESSAGES
          value: "1"
        - name: KAFKA_LOG_FLUSH_INTERVAL_MS
          value: "100"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_METADATA_LOG_SEGMENT_MS
          value: "15000"
        - name: KAFKA_METADATA_MAX_RETENTION_MS
          value: "86400000"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        livenessProbe:
          exec:
            command:
            - kafka-broker-api-versions
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - kafka-broker-api-versions
            - --bootstrap-server
            - localhost:9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
spec:
  template:
    spec:
      containers:
      - name: kafka-init
        image: confluentinc/cp-kafka:8.0.0
        command:
        - /bin/sh
        - -c
        - |
          echo 'Waiting for Kafka KRaft cluster to be ready...'
          sleep 60
          
          # Create topics with proper replication for RPO=0
          kafka-topics --bootstrap-server kafka-cluster:9092 --create --if-not-exists --topic fixlite.session.events --partitions 6 --replication-factor 3 --config min.insync.replicas=2
          kafka-topics --bootstrap-server kafka-cluster:9092 --create --if-not-exists --topic fixlite.message.journal --partitions 12 --replication-factor 3 --config min.insync.replicas=2
          kafka-topics --bootstrap-server kafka-cluster:9092 --create --if-not-exists --topic fixlite.session.state --partitions 6 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=compact
          
          echo 'Kafka topics created successfully with KRaft'
      restartPolicy: OnFailure
  backoffLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-service
spec:
  selector:
    app: kafka-ui
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: "fixlite-cluster"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: "kafka-cluster:9092"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
