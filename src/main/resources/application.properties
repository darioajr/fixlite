# FixLite Gateway Configuration

# Server Configuration
fixlite.server.port=9878
fixlite.server.gateway-id=FIXLITE-GW-01

# Kafka Configuration for RPO=0
fixlite.kafka.bootstrap-servers=localhost:9092
fixlite.kafka.replication-factor=3
fixlite.kafka.min-insync-replicas=2
fixlite.kafka.acks=all
fixlite.kafka.retries=2147483647
fixlite.kafka.max-in-flight-requests=1
fixlite.kafka.enable-idempotence=true

# Topic Configuration
fixlite.kafka.topics.session-events=fixlite.session.events
fixlite.kafka.topics.message-journal=fixlite.message.journal
fixlite.kafka.topics.session-state=fixlite.session.state

# Consumer Groups
fixlite.kafka.consumer-groups.session-recovery=fixlite-session-recovery
fixlite.kafka.consumer-groups.message-processor=fixlite-message-processor

# Performance Tuning
fixlite.kafka.linger-ms=0
fixlite.kafka.batch-size=16384
fixlite.kafka.buffer-memory=33554432
fixlite.kafka.compression-type=lz4

# Session Management
fixlite.session.heartbeat-interval=30
fixlite.session.test-request-timeout=36
fixlite.session.recovery-timeout=120000
fixlite.session.takeover-timeout=120000

# Persistence
fixlite.persistence.state-persist-interval=10000
fixlite.persistence.enable-message-journal=true
fixlite.persistence.enable-session-events=true

# Monitoring
fixlite.monitoring.metrics-enabled=true
fixlite.monitoring.health-check-enabled=true
